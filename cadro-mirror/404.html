<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = window.location.pathname;
      if (path !== '/' && !path.endsWith('.html')) {
        var cleanPath = path.endsWith('/') ? path.slice(0, -1) : path;
        var lastSegment = cleanPath.substring(cleanPath.lastIndexOf('/') + 1);
        // Only redirect extensionless paths; leave missing static assets (e.g. .png) alone
        if (lastSegment && !lastSegment.includes('.')) {
          var newPath = cleanPath + '.html';
          window.location.replace(newPath + window.location.search + window.location.hash);
        }
      }
    })();
  </script>
</head>
<body>
  <p>Page not found. <a href="/">Return to homepage</a></p>
</body>
</html>
