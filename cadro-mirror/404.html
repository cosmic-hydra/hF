<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = window.location.pathname;
      if (path !== '/' && !path.endsWith('.html')) {
        var newPath = path.endsWith('/') ? path + 'index.html' : path + '.html';
        window.location.replace(newPath + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <p>Page not found. <a href="/">Return to homepage</a></p>
</body>
</html>
