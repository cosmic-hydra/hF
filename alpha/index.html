<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://docs.google.com/forms/d/e/1FAIpQLSd99DKXF3Bdk9KvD9j0UcB1kUgrIvwqhhisNEesBkIQ0_VX6w/viewform?usp=publish-editor">
  <!-- Fallback redirect for clients without JavaScript -->
  <meta http-equiv="refresh" content="0; url=https://docs.google.com/forms/d/e/1FAIpQLSd99DKXF3Bdk9KvD9j0UcB1kUgrIvwqhhisNEesBkIQ0_VX6w/viewform?usp=publish-editor">
  <script>
    // Instant redirect; replace() keeps this page out of the browser history.
    window.location.replace("https://docs.google.com/forms/d/e/1FAIpQLSd99DKXF3Bdk9KvD9j0UcB1kUgrIvwqhhisNEesBkIQ0_VX6w/viewform?usp=publish-editor");
  </script>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0c;
      color: #e9e9ec;
      text-align: center;
      padding: 1.5rem;
    }
    main { max-width: 28rem; }
    .spinner {
      width: 2.25rem;
      height: 2.25rem;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0.25rem 0; line-height: 1.5; }
    a { color: #8ab4f8; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <p>Redirecting you to the form…</p>
    <p>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSd99DKXF3Bdk9KvD9j0UcB1kUgrIvwqhhisNEesBkIQ0_VX6w/viewform?usp=publish-editor">
        Click here if you are not redirected automatically.
      </a>
    </p>
  </main>
</body>
</html>
